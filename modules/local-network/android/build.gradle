apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.localnetwork'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
if (expoModulesCorePlugin.exists()) {
  apply from: expoModulesCorePlugin
  applyKotlinExpoModulesCorePlugin()
}

android {
  namespace "expo.modules.localnetwork"
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  // No third-party networking/TLS/JSON libraries — TCP/UDP/TLS use the
  // platform java.net/javax.net.ssl APIs directly, and JSON parsing uses
  // org.json (bundled with Android) rather than adding Gson/Moshi/etc.
  // See 05-project-structure-and-dependencies.md §4 (dependency rules) and
  // 06-performance-and-size.md §1 (50 MB target).
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
